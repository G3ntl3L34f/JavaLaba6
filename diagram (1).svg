      <text x="164.57" y="340" class="class-member mono" dy="0.35em"><tspan class="member-visibility">- </tspan><tspan class="member-name">measure</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">MeasureCount</tspan></text>
      <line x1="156.57" y1="354" x2="370.57" y2="354" class="class-divider"/>
      <text x="164.57" y="368" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">TemperatureMeasure(Sensor h)</tspan></text>
      <text x="164.57" y="388" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">getNumber()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">int</tspan></text>
      <text x="164.57" y="408" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">getValue()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">double</tspan></text>
      <text x="164.57" y="428" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">setValue()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">void</tspan></text>
      <text x="164.57" y="448" class="class-member mono" text-decoration="underline" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">getTotal()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">int</tspan></text>
    </g>
