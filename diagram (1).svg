      <text x="275.95" y="122" class="class-member mono" text-decoration="underline" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">show(TemperatureMeasure t)</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">void</tspan></text>
    </g>
