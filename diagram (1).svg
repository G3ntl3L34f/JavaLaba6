    <polyline points="211.62,462 211.62,602" class="class-relationship" marker-start="url(#cls-aggregation)" data-from="TemperatureMeasure" data-to="Sensor" data-type="aggregation" data-marker-at="source" data-label="Агрегация (h)"/>
    <polyline points="315.52,462 315.52,582" class="class-relationship" marker-start="url(#cls-composition)" data-from="TemperatureMeasure" data-to="MeasureCount" data-type="composition" data-marker-at="source" data-label="Композиция (measure)"/>
    <polyline points="343.69,136 343.69,274" class="class-relationship" stroke-dasharray="6 4" marker-end="url(#cls-arrow)" data-from="ShowTemperature" data-to="TemperatureMeasure" data-type="dependency" data-marker-at="target" data-label="Зависимость"/>
    <g class="class-node" data-id="ITemperatureMeasure" data-label="ITemperatureMeasure" data-annotation="interface">
