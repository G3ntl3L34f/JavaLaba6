      <text x="58" y="120" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">setValue()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">void</tspan></text>
      <text x="58" y="140" class="class-member mono" dy="0.35em"><tspan class="member-visibility">+ </tspan><tspan class="member-name">getValue()</tspan><tspan class="member-punct">: </tspan><tspan class="member-type">double</tspan></text>
    </g>
