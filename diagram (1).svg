<svg class="light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488.35 730" width="488.35" height="730">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans', sans-serif; }
  .mono { font-family: 'Google Sans Mono', monospace; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
.class-box { fill: var(--classBkg, var(--_node-fill)); stroke: var(--classBorder, var(--_node-stroke)); stroke-width: var(--_node-stroke-width, 1px); }
.class-header-box { fill: var(--classHeaderBkg, var(--_group-hdr)); stroke: var(--classBorder, var(--_node-stroke)); stroke-width: var(--_node-stroke-width, 1px); }
.class-title { fill: var(--classTextColor, var(--_text)); font-weight: 700; }
.class-annotation { fill: var(--_text-muted); font-size: 10px; font-weight: 500; font-style: italic; }
.class-divider { stroke: var(--classBorder, var(--_node-stroke)); stroke-width: 1px; }
.class-member { font-size: 11px; font-weight: 400; }
.member-visibility { fill: var(--_text-muted); }
.member-name { fill: var(--_text); }
.member-punct { fill: var(--_text-muted); }
.member-type { fill: var(--_text-sec); }
.class-relationship { fill: none; stroke: var(--_line); stroke-width: 1.5; }
.edge-label-bg { fill: var(--bg); stroke: var(--_inner-stroke); stroke-width: 1.0; }
.edge-label { fill: var(--_text-sec); }</style>
  <defs>
    <marker id="cls-inherit" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
      <polygon points="0,0 12,5 0,10" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5"/>
    </marker>
    <marker id="cls-composition" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
      <polygon points="6,0 12,5 6,10 0,5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="1"/>
    </marker>
    <marker id="cls-aggregation" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto-start-reverse">
      <polygon points="6,0 12,5 6,10 0,5" fill="var(--bg)" stroke="var(--_arrow)" stroke-width="1.5"/>
    </marker>
    <marker id="cls-arrow" refX="8" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polyline points="0,0 8,3 0,6" fill="none" stroke="var(--_arrow)" stroke-width="1.5"/>
    </marker>
  </defs>
  <g transform="translate(-35, -35)">
